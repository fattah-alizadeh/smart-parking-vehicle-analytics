# Vehicle tracking configuration

video:
  input_path: "data/public/aicity/cam_1.mp4"
  output_path: "results/videos/cam_1_annotated.mp4"

model:
  name: "yolo11n.pt"
  confidence_threshold: 0.25
  image_size: 960
  tracker: "bytetrack.yaml"

counting:
  line_start: [389, 356]
  line_end: [271, 258]

analytics:
  min_trajectory_points: 5
  output_csv: "results/analytics/cam_1_vehicle_movements.csv"